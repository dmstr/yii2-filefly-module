# file generated with AI assistance: Claude Code - [2026-11-11 21:00:00 UTC]
# vsftpd for the adapter probe: local user, chroot to its home, passive
# ports 30000-30009, explicit TLS optional (plain FTP and FTPS on port 21).
# Passive mode: no pasv_address, so vsftpd advertises the address the client
# connected to, which is the container address inside the compose network.
listen=YES
listen_ipv6=NO
background=NO
seccomp_sandbox=NO
# no namespace isolation per session: unprivileged containers cannot create
# the namespaces, and vsftpd 3.0.5 on Alpine was seen to exit with SIGSEGV
isolate=NO
isolate_network=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
chroot_local_user=YES
allow_writeable_chroot=YES
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30009
xferlog_enable=NO
ssl_enable=YES
allow_anon_ssl=NO
force_local_logins_ssl=NO
force_local_data_ssl=NO
ssl_tlsv1=NO
ssl_sslv2=NO
ssl_sslv3=NO
rsa_cert_file=/etc/ftp-test/cert.pem
rsa_private_key_file=/etc/ftp-test/key.pem
