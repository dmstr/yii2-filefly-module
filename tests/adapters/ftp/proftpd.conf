# file generated with AI assistance: Claude Code - [2026-11-11 21:00:00 UTC]
# ProFTPD for the adapter probe: local user, chroot to its home, passive
# ports 30000-30009, explicit TLS optional (plain FTP and FTPS on port 21).
ServerName "filefly probe ProFTPD"
ServerType standalone
DefaultServer on
Port 21
UseIPv6 off
User nobody
Group nobody
Umask 022
DefaultRoot ~
RequireValidShell off
AllowOverwrite on
PassivePorts 30000 30009
MaxInstances 50
WtmpLog off
UseReverseDNS off
ScoreboardFile /run/proftpd/proftpd.scoreboard
PidFile /run/proftpd/proftpd.pid
DelayTable none

<IfModule mod_dso.c>
  LoadModule mod_tls.c
</IfModule>

<IfModule mod_tls.c>
  TLSEngine on
  TLSRequired off
  # Default: TLS 1.2 only. With TLS 1.3 and the default session reuse
  # requirement, PHP's ext-ftp fails from the second data connection of a
  # session on ("client did not reuse TLS session"); the service
  # `proftpd-tls13` starts with -DTLS13 to show exactly that.
  <IfDefine TLS13>
    TLSProtocol TLSv1.2 TLSv1.3
  </IfDefine>
  <IfDefine !TLS13>
    TLSProtocol TLSv1.2
  </IfDefine>
  TLSRSACertificateFile /etc/ftp-test/cert.pem
  TLSRSACertificateKeyFile /etc/ftp-test/key.pem
  TLSVerifyClient off
  TLSLog /var/log/proftpd/tls.log
</IfModule>
