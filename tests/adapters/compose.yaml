# file generated with AI assistance: Claude Code - [2026-11-11 21:00:00 UTC]
# Adapter test stack for the Flysystem 3 migration of filefly: two
# S3-compatible servers, three FTP daemons (each plain FTP and explicit
# FTPS on port 21), the PHP probe and the module's adapter suite, which both
# run inside this network.
#
# No fixed host ports: FTP is only reachable inside the compose network (the
# probe runs there, so passive mode needs no published ports and no
# advertised address); the S3 APIs are published to ephemeral host ports on
# 127.0.0.1 for ad-hoc use, see `docker compose port`. All server state is
# on tmpfs and disappears with `docker compose down`.
# Usage: ./README.md. Credentials: ./test-credentials.env only.
name: filefly-adapters

x-ftp: &ftp
  build: ./ftp
  image: filefly-adapters/ftp:local
  env_file: ./test-credentials.env
  tmpfs:
    - /srv/ftp
  healthcheck:
    test: ["CMD", "nc", "-z", "127.0.0.1", "21"]
    interval: 2s
    timeout: 2s
    retries: 30

services:
  garage:
    image: dxflrs/garage:v2.5.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    env_file: ./test-credentials.env
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
    tmpfs:
      - /var/lib/garage
    ports:
      - "127.0.0.1::3900"
    healthcheck:
      test: ["CMD", "/garage", "bucket", "info", "filefly-probe"]
      interval: 2s
      timeout: 5s
      retries: 30

  rustfs:
    image: rustfs/rustfs:1.0.5
    env_file: ./test-credentials.env
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
    tmpfs:
      - /data:uid=10001,gid=10001
    ports:
      - "127.0.0.1::9000"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30

  vsftpd:
    <<: *ftp
    command: ["vsftpd"]

  proftpd:
    <<: *ftp
    command: ["proftpd"]

  # Same ProFTPD with TLS 1.3 enabled and the default session reuse
  # requirement, see ./ftp/proftpd.conf
  proftpd-tls13:
    <<: *ftp
    command: ["proftpd"]
    environment:
      PROFTPD_DEFINE: TLS13

  pureftpd:
    <<: *ftp
    command: ["pure-ftpd"]

  probe:
    build:
      context: .
      dockerfile: runner/Dockerfile
    image: filefly-adapters/probe:local
    env_file: ./test-credentials.env
    volumes:
      - ./:/adapters
    profiles: ["probe"]
    depends_on:
      garage: {condition: service_healthy}
      rustfs: {condition: service_healthy}
      vsftpd: {condition: service_healthy}
      proftpd: {condition: service_healthy}
      proftpd-tls13: {condition: service_healthy}
      pureftpd: {condition: service_healthy}

  # The module's adapter suite (./phpunit.xml): the storage contract, the
  # HTTP API and the console command against the local adapter and every
  # server above except proftpd-tls13 (known server-side failure, see
  # ./README.md). The module checkout is mounted read-only with its vendor/
  # (composer install on the host, require-dev has the S3 and FTP adapters).
  suite:
    build:
      context: .
      dockerfile: runner/Dockerfile
    image: filefly-adapters/probe:local
    env_file: ./test-credentials.env
    environment:
      FILEFLY_ADAPTER_STACK: "1"
    volumes:
      - ../..:/module:ro
    working_dir: /module
    command: ["php", "vendor/bin/phpunit", "-c", "tests/adapters/phpunit.xml"]
    profiles: ["suite"]
    depends_on:
      garage: {condition: service_healthy}
      rustfs: {condition: service_healthy}
      vsftpd: {condition: service_healthy}
      proftpd: {condition: service_healthy}
      pureftpd: {condition: service_healthy}
